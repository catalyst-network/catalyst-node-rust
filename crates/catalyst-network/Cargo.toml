[package]
name = "catalyst-network"
version = "0.1.0"
edition = "2021"
authors = ["Catalyst Network Team"]
description = "P2P networking layer for Catalyst Network blockchain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/catalyst-network/catalyst-node-rust"
keywords = ["blockchain", "p2p", "networking", "catalyst"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Core Catalyst dependencies
catalyst-utils = { path = "../catalyst-utils" }
catalyst-crypto = { path = "../catalyst-crypto" }
catalyst-config = { path = "../catalyst-config" }

# Networking with libp2p (match workspace + enable tokio + macros)
libp2p = { workspace = true, features = ["tokio", "macros"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
bincode = { workspace = true }

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"
# `catalyst_utils::logging::log_info!`/`log_warn!` route through a global CatalystLogger that
# catalyst-cli never initializes (no `init_logger` call anywhere), so those macros are silent
# no-ops in production -- confirmed live 2026-08-18 investigating a gossip-mesh stall, where even
# pre-existing `log_warn!` calls in service.rs (e.g. "libp2p listening on ...") never reached
# journald. `tracing` is what catalyst-cli's `init_logging` actually wires up process-wide, and any
# crate calling `tracing::info!` directly gets captured regardless of which crate emits it.
tracing = "0.1"

# Metrics (optional)
prometheus = { version = "0.14", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
catalyst-utils = { path = "../catalyst-utils" }

[[test]]
name = "tcp_batch_drop"
required-features = ["test-hooks"]
# Exercises simple TCP relay (`--no-default-features`); libp2p gossipsub mesh timing is not deterministic here.

[features]
default = ["metrics", "libp2p-full"]
metrics = ["prometheus"]
# Compile the full libp2p stack (gossipsub + mdns + identify + ping).
libp2p-full = []
# Exposes `NetworkService::inject_test_envelope` for TCP/gossip integration tests.
test-hooks = []